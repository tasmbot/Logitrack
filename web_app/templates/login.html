{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded shadow mt-10">
    <h1 class="text-2xl font-bold mb-6">Вход в систему</h1>
    <form action="/login" method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium">Email</label>
            <input type="email" name="email" required class="w-full p-2 border rounded mt-1">
        </div>
        <div>
            <label class="block text-sm font-medium">Пароль</label>
            <input type="password" name="password" required class="w-full p-2 border rounded mt-1">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Войти</button>
    </form>
    <div class="mt-4 text-center text-sm text-gray-600">
        Нет аккаунта? <a href="/register" class="text-blue-600 hover:underline font-medium">Зарегистрироваться</a>
    </div>
</div>
{% endblock %}
